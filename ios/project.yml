name: Umpi
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: iphoneos
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.9.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.2
targets:
  Umpi:
    type: application
    platform: iOS
    sources:
      - path: Umpi
        excludes:
          - Info.plist
          - Umpi.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Umpi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Umpi/Umpi.entitlements
        INFOPLIST_FILE: Umpi/Info.plist
    dependencies:
      - target: UmpiWidgets
      - package: Markdown
      - package: FluidAudio
        product: FluidAudio
  UmpiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: UmpiWidgets
        excludes:
          - Info.plist
          - UmpiWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER).widgets
        PRODUCT_NAME: UmpiWidgets
        INFOPLIST_FILE: UmpiWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: UmpiWidgets/UmpiWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # The Mac app shares the phone's code. iOS-only parts (app delegate, background refresh, alarms and Live
  # Activities, the UIKit message field) are left out and replaced by files in UmpiMac.
  UmpiMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Umpi
        excludes:
          - Info.plist
          - Umpi.entitlements
          - Assets.xcassets
          - AppDelegate.swift
          - UmpiApp.swift
          - BackgroundSync.swift
          - DeviceCapabilities.swift
          - Views/ComposerTextView.swift
      - path: Shared/WidgetShared.swift
      - path: UmpiMac
        excludes:
          - Info.plist
          - UmpiMac.entitlements
    settings:
      base:
        SDKROOT: macosx
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER).mac
        PRODUCT_NAME: Umpi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: UmpiMac/UmpiMac.entitlements
        INFOPLIST_FILE: UmpiMac/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Markdown
      - package: FluidAudio
        product: FluidAudio
  # Logic tests for the Mac-only code that needs no running app.
  UmpiMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - UmpiMacTests
      - path: UmpiMac/Shortcut.swift
      - path: UmpiMac/ChatNotifier.swift
    settings:
      base:
        SDKROOT: macosx
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER).mactests
        GENERATE_INFOPLIST_FILE: YES
  UmpiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UmpiTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Umpi
  UmpiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UmpiUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UMPI_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Umpi
schemes:
  Umpi:
    build:
      targets:
        Umpi: all
        UmpiWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UmpiTests
        - UmpiUITests
    archive:
      config: Release
  UmpiMac:
    build:
      targets:
        UmpiMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UmpiMacTests
    archive:
      config: Release
